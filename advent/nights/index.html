  return '<div class="kind">'+esc(dd.k)+'</div><h3>'+esc(fill(dd.t))+'</h3><div class="body">'+fill(esc(dd.b)).replace(/\n/g,"<br>")+'</div>'+
    (dd.a?'<div class="ans" id="ans">'+(ui.ans?esc(dd.a):'<button class="lnk" id="showans">Tap for the answer</button>')+'</div>':'')+
    (dd.g&&dd.g.length?'<div class="tags">'+dd.g.map(function(x){return '<span>'+esc(x)+'</span>'}).join("")+'</div>':'')}
function renderView(justOpened){
  var d=ui.view,v=$("#view");if(d==null){v.classList.remove("on");v.innerHTML="";return}
  var practice=d===0;var dd=practice?E.practice:doorData(d);
  var opened=practice?ui.revealed:!!S.opened[d];
  var h='<div class="sheet'+(justOpened?' pop':'')+'"><button class="x" id="vclose" aria-label="Close">&times;</button><div class="day">'+(practice?"Practice door":"December "+d)+'</div>';
  if(!opened){
    var ai=(d||0)%E.art.length;
    h+='<div class="scratchwrap" style="height:270px;margin-top:12px"><button class="under" id="underart"><span class="art">'+E.art[ai]+'</span><span class="found">'+esc(E.artNames[ai])+'</span><span class="go">Tap to open →</span></button><canvas id="scr"></canvas><div class="scrhint">'+(E.scratchHint||"Scratch me!")+'</div></div>'+
       '<div class="row" style="justify-content:center;margin-top:10px"><button class="lnk" id="tapopen">Skip the scratching</button></div>';
  }else if(E.pgSwitch&&S.pg&&!ui.pgShow){
    h+='<div class="pgcover" style="margin-top:12px"><div class="kind">Door '+d+'</div><h3 style="margin:6px 0">Open when you’re alone</h3><button class="btn gold" id="pgshow">Show it</button></div>';
  }else{
    h+=(justOpened?burst():'')+contentHTML(dd,d);
    if(!practice){
      h+='<div class="done-row"><button class="tick'+(S.done[d]?" on":"")+'" id="vdone">'+(S.done[d]?"✓ ":"")+(E.doneLabel||"We did it!")+'</button>'+
        '<textarea class="note" id="vnote" placeholder="'+esc(E.notePh||"How did it go?")+'">'+esc(S.notes[d]||"")+'</textarea>'+
        '<div class="row" style="margin-top:10px;justify-content:space-between"><span class="row"><button class="bbbtn sm pine" id="vshare">'+esc(E.shareLabel||"Share on WhatsApp")+'</button>'+(E.tease?'<button class="bbbtn sm" id="vtease">Tease them 🔒</button>':'')+'</span>'+(E.swaps&&E.swaps.length?'<button class="lnk" id="vswap">'+(S.swap[d]!=null?"Swap again":"Busy day? Swap it")+'</button>':'')+'</div></div>';
    }else h+='<p class="small" style="margin-top:14px">That’s how it works! On 1 December the first real door unlocks.</p>';
  }
  h+='</div>';v.innerHTML=h;v.classList.add("on");
  if(!opened)setupScratch(d);
}
function openDoor(d){if(d===0){ui.revealed=true}else{S.opened[d]=true;save()}ui.ans=false;renderView(true);render()}
function setupScratch(d){var cv=$("#scr");if(!cv)return;var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;var x=cv.getContext("2d");x.scale(dpr,dpr);
  var g=x.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,"#D9B46A");g.addColorStop(.5,"#B98A3C");g.addColorStop(1,"#A87A30");x.fillStyle=g;x.fillRect(0,0,r.width,r.height);
  x.fillStyle="rgba(255,248,230,.5)";for(var i=0;i<60;i++){x.font=(8+Math.random()*10)+"px serif";x.fillText(Math.random()<.5?"★":"✦",Math.random()*r.width,Math.random()*r.height)}
  x.globalCompositeOperation="destination-out";var down=false,last=null,moves=0;
  function pt(e){var b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}}
  function draw(p){x.lineWidth=30;x.lineCap="round";x.beginPath();if(last){x.moveTo(last.x,last.y)}else x.moveTo(p.x,p.y);x.lineTo(p.x+.1,p.y+.1);x.stroke();last=p;moves++;var h=document.querySelector(".scrhint");if(h)h.style.opacity=0}
  function check(){var w=cv.width,hh=cv.height,data=x.getImageData(0,0,w,hh).data,clr=0,tot=0;for(var i=3;i<data.length;i+=4*40){tot++;if(data[i]===0)clr++}if(clr/tot>.62&&!cv.dataset.done){cv.dataset.done=1;cv.style.transition="opacity .6s";cv.style.opacity=0;cv.style.pointerEvents="none";var u=document.getElementById("underart");if(u)u.classList.add("ready");ui.readyAt=Date.now()}}
  cv.addEventListener("pointerdown",function(e){down=true;last=null;cv.setPointerCapture(e.pointerId);draw(pt(e))});
  cv.addEventListener("pointermove",function(e){if(down){draw(pt(e));if(moves%8===0)check()}});
  cv.addEventListener("pointerup",function(){down=false;last=null;check()});
}
function icsDate(y,m,d,t){var p=t.split(":");function z(n){return (n<10?"0":"")+n}return y+z(m)+z(d)+"T"+z(+p[0])+z(+p[1])+"00"}
function makeICS(){var y=yr(),n=now(),url=location.origin+location.pathname,L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//BrightBlueprintCo//Advent//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  for(var d=1;d<=24;d++){var dt=new Date(y,11,d);if(dt<new Date(n.getFullYear(),n.getMonth(),n.getDate()))continue;var p=S.remTime.split(":"),e=new Date(y,11,d,+p[0],+p[1]+10);
    L.push("BEGIN:VEVENT","UID:bbco-"+E.id+"-"+y+"-"+d+"@brightblueprintco","DTSTAMP:"+icsDate(n.getFullYear(),n.getMonth()+1,n.getDate(),"00:00")+"Z","DTSTART:"+icsDate(y,12,d,S.remTime),"DTEND:"+icsDate(y,12,d,(e.getHours())+":"+e.getMinutes()),
      "SUMMARY:"+(E.remTitle||"🎄 Door {d} is open!").replace("{d}",d),"DESCRIPTION:"+(E.remDesc||"Tap to scratch it:")+" "+url,"URL:"+url,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+(E.remTitle||"🎄 Door {d} is open!").replace("{d}",d),"TRIGGER:PT0M","END:VALARM","END:VEVENT")}
  L.push("END:VCALENDAR");return L.join("\r\n")}
function addReminders(){var ics=makeICS();var blob=new Blob([ics],{type:"text/calendar"});var u=URL.createObjectURL(blob);var a=document.createElement("a");a.href=u;a.download=(E.id)+"-advent-reminders.ics";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},2000);
  S.remAdded=true;save();render();toast("Tap “Add All” to put them in your calendar")}
function partnerLink(){return location.origin+location.pathname+"#n="+encodeURIComponent(S.names)}
function shareText(d){var dd=doorData(d);return (E.shareEmoji||"🎄")+" "+(E.sharePrefix||"Day {d} of our advent").replace("{d}",d)+": "+fill(dd.t)+"\n\n"+fill(dd.b)+(dd.a?"\n\n("+dd.a+")":"")+"\n\n"+fill(E.shareTail||"")}
/* events */
document.addEventListener("click",function(e){var t=e.target;
  var door=t.closest("[data-door]");if(door){var d=+door.dataset.door;if(!unlocked(d)){toast("No peeking! Door "+d+" opens on "+d+" December");return}ui.view=d;ui.pgShow=false;ui.ans=false;renderView();return}
  if(t.closest("[data-pg]")){S.pg=t.closest("[data-pg]").dataset.pg==="1";save();render();return}
  var id=(t.closest("button")||{}).id;
  switch(id){
    case "practice":ui.view=0;ui.revealed=false;renderView();break;
    case "vclose":ui.view=null;renderView();break;
    case "tapopen":openDoor(ui.view);break;
    case "underart":var ua=document.getElementById("underart");if(ua&&ua.classList.contains("ready")&&Date.now()-(ui.readyAt||0)>500&&!ui.dragged)openDoor(ui.view);break;
    case "pgshow":ui.pgShow=true;renderView();break;
    case "showans":ui.ans=true;renderView();break;
    case "vdone":S.done[ui.view]=!S.done[ui.view];save();renderView();render();if(S.done[ui.view])toast("Ticked off! Added to your memories");break;
    case "vshare":BB.openWA("",shareText(ui.view));break;
    case "vtease":BB.openWA("",(E.teaseText||"").replace("{d}",ui.view).replace("{time}",fmtT(S.remTime)));break;
    case "addrem":addReminders();break;
    case "sendpartner":BB.openWA("",fill(E.partnerText||"")+"\n"+partnerLink());break;
    case "setupdone":S.setupDone=true;ui.setup=false;save();render();window.scrollTo(0,0);break;
    case "wipe":if(!ui.wipe){ui.wipe=true;render();setTimeout(function(){ui.wipe=false;render()},5000)}else{S.opened={};S.done={};S.notes={};S.swap={};ui.wipe=false;save();render();window.scrollTo(0,0);toast("All doors closed again")}break;
    case "opensetup":ui.setup=true;render();window.scrollTo(0,0);break;
    case "vswap":var d=ui.view;var cur=S.swap[d];var nx=cur==null?(d*7)%E.swaps.length:(cur+1)%E.swaps.length;S.swap[d]=nx;save();ui.ans=false;renderView();render();toast("Swapped for a quick one");break;
    case "sharemem":var L=[];for(var i=1;i<=24;i++)if(S.done[i]||S.notes[i])L.push("Dec "+i+": "+fill(doorData(i).t)+(S.notes[i]?" ("+S.notes[i]+")":""));BB.openWA("",(E.memTitle||"Our advent so far")+" "+(E.shareEmoji||"🎄")+"\n\n"+L.join("\n"));break;
  }
  if(t.id==="view"){ui.view=null;renderView()}
});
document.addEventListener("pointerdown",function(e){ui.pd={x:e.clientX,y:e.clientY};ui.dragged=false});
document.addEventListener("pointerup",function(e){if(ui.pd)ui.dragged=Math.hypot(e.clientX-ui.pd.x,e.clientY-ui.pd.y)>12});
document.addEventListener("input",function(e){if(e.target.id==="remtime"){S.remTime=e.target.value||S.remTime;save()}if(e.target.id==="names"){S.names=e.target.value;save();$("#sleeps")}if(e.target.id==="vnote"){S.notes[ui.view]=e.target.value;save()}});
document.addEventListener("change",function(e){if(e.target.id==="names"||e.target.id==="vnote")render(true)});
BB.init({key:KEY,appName:E.appName,frames:["hat","tag","snow"],defIcon:"icon-180.png",defCountry:"GB",help:E.help,cardSel:".card",
  getState:function(){return S},setState:function(o){S=o;var d=defaults();for(var k in d)if(S[k]===undefined)S[k]=d[k];save();render()},
  valid:function(o){return !!(o&&o.opened)},isEmpty:function(){return !Object.keys(S.opened).length&&!S.names},toast:toast,render:function(){render()}});
(function(){var m=location.hash.match(/^#n=(.+)$/);if(m){var nm="";try{nm=decodeURIComponent(m[1])}catch(e){}if(nm&&!S.names){S.names=nm;save()}try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}setTimeout(function(){toast(E.partnerWelcome||"Welcome! Your calendar is ready")},400)}})();
render();
})();
</script>
</body>
